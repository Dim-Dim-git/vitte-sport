<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-label="Схема: отбор мяча в коридоре" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Отбор мяча и опека игрока</title>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#C21631" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#4F6A84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="70" y="70" width="500" height="120" rx="6" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="570" y1="70" x2="570" y2="190" stroke="#132041" stroke-width="4"/>

  <line x1="170" y1="130" x2="320" y2="130" stroke="#C21631" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="410" y1="130" x2="520" y2="130" stroke="#4F6A84" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a4g)"/>

  <circle cx="150" cy="130" r="13" fill="#132041"/>
  <circle cx="385" cy="130" r="13" fill="#C21631"/>

  <g font-family="Montserrat" font-size="13" fill="#4F6A84">
