<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-label="Схема: удары по воротам с линии штрафной" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Удары по воротам с линии штрафной</title>
  <defs>
    <marker id="ar-red2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#C21631" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="40" width="400" height="200" rx="4" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5 5"/>
  <rect x="190" y="40" width="140" height="55" fill="none" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="205" y1="40" x2="315" y2="40" stroke="#132041" stroke-width="4"/>

  <line x1="150" y1="215" x2="228" y2="52" stroke="#C21631" stroke-width="2" marker-end="url(#ar-red2)"/>
  <line x1="260" y1="222" x2="260" y2="52" stroke="#C21631" stroke-width="2" marker-end="url(#ar-red2)"/>
  <line x1="370" y1="215" x2="292" y2="52" stroke="#C21631" stroke-width="2" marker-end="url(#ar-red2)"/>

  <circle cx="145" cy="228" r="12" fill="#132041"/>
  <circle cx="260" cy="235" r="12" fill="#132041"/>
  <circle cx="375" cy="228" r="12" fill="#132041"/>
  <circle cx="260" cy="52"  r="10" fill="#C21631"/>

  <g font-family="Montserrat" font-size="13" fill="#4F6A84">
    <text x="260" y="30"  text-anchor="middle">ворота</text>
    <text x="260" y="275" text-anchor="middle">точки удара — 16–18 м от ворот</text>
    <text x="260" y="300" text-anchor="middle">красный — вратарь, стрелки — направления ударов</text>
  </g>
