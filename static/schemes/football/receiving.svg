<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" role="img" aria-label="Схема: приём мяча в парах" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Приём и обработка мяча</title>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#C21631" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="110" y="40" width="460" height="150" rx="8" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5 5"/>

  <path d="M196 152 Q340 56 474 150" fill="none" stroke="#C21631" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a3)"/>
  <path d="M478 172 L202 172" fill="none" stroke="#C21631" stroke-width="2" marker-end="url(#a3)"/>

  <circle cx="180" cy="160" r="13" fill="#132041"/>
  <circle cx="490" cy="160" r="13" fill="#132041"/>

