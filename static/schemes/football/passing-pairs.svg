<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-label="Схема: передачи в парах в движении" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Передачи в парах в движении</title>
  <defs>
    <marker id="arrow-red2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#C21631" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#4F6A84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="170" y="40" width="340" height="205" rx="8" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5 5"/>

  <line x1="250" y1="205" x2="250" y2="64" stroke="#4F6A84" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-grey)"/>
  <line x1="430" y1="205" x2="430" y2="64" stroke="#4F6A84" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-grey)"/>

  <line x1="266" y1="211" x2="410" y2="177" stroke="#C21631" stroke-width="2" marker-end="url(#arrow-red2)"/>
  <line x1="414" y1="172" x2="270" y2="138" stroke="#C21631" stroke-width="2" marker-end="url(#arrow-red2)"/>
  <line x1="266" y1="133" x2="410" y2="99"  stroke="#C21631" stroke-width="2" marker-end="url(#arrow-red2)"/>

  <circle cx="250" cy="221" r="13" fill="#132041"/>
  <circle cx="430" cy="221" r="13" fill="#C21631"/>
  <g font-family="Montserrat" font-size="13" font-weight="bold" fill="#FFFFFF">
    <text x="250" y="226" text-anchor="middle">А</text>
    <text x="430" y="226" text-anchor="middle">Б</text>
  </g>

  <g font-family="Montserrat" font-size="13" fill="#4F6A84">
    <text x="340" y="270" text-anchor="middle">сплошные линии — передачи, пунктир — движение игроков</text>
  </g>
