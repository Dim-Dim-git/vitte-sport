<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-label="Схема: игра в квадрате четыре против двух" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Игра в квадрате 4 на 2</title>
  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#C21631" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="80" y="40" width="300" height="200" rx="8" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5 5"/>

  <line x1="98" y1="40" x2="362" y2="40" stroke="#C21631" stroke-width="2" marker-end="url(#ar-red)"/>
  <line x1="380" y1="58" x2="380" y2="222" stroke="#C21631" stroke-width="2" marker-end="url(#ar-red)"/>
  <line x1="362" y1="240" x2="98" y2="240" stroke="#C21631" stroke-width="2" marker-end="url(#ar-red)"/>

  <circle cx="80"  cy="40"  r="13" fill="#132041"/>
  <circle cx="380" cy="40"  r="13" fill="#132041"/>
  <circle cx="380" cy="240" r="13" fill="#132041"/>
  <circle cx="80"  cy="240" r="13" fill="#132041"/>
  <circle cx="200" cy="128" r="13" fill="#C21631"/>
  <circle cx="262" cy="158" r="13" fill="#C21631"/>

  <g font-family="Montserrat" font-size="13" font-weight="bold" fill="#FFFFFF">
    <text x="80"  y="45"  text-anchor="middle">1</text>
    <text x="380" y="45"  text-anchor="middle">2</text>
    <text x="380" y="245" text-anchor="middle">3</text>
    <text x="80"  y="245" text-anchor="middle">4</text>
  </g>

  <g font-family="Montserrat" font-size="13" fill="#4F6A84">
    <text x="230" y="275" text-anchor="middle">квадрат 10 × 10 м</text>
    <text x="230" y="300" text-anchor="middle">синие — владеют мячом, красные — отбирают</text>
  </g>
</svg>
