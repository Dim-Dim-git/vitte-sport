<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-label="Схема: разминочный круг по периметру площадки" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Разминка в движении</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#C21631" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="140" y="60" width="400" height="150" rx="6" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5 5"/>

  <line x1="170" y1="60" x2="510" y2="60"  stroke="#C21631" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="540" y1="88" x2="540" y2="182" stroke="#C21631" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="510" y1="210" x2="170" y2="210" stroke="#C21631" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="140" y1="182" x2="140" y2="88"  stroke="#C21631" stroke-width="2" marker-end="url(#a1)"/>

  <g font-family="Montserrat" font-size="13" fill="#4F6A84">
    <text x="340" y="46"  text-anchor="middle">лёгкий бег</text>
    <text x="672" y="140" text-anchor="end">приставные шаги</text>
    <text x="340" y="232" text-anchor="middle">бег спиной вперёд</text>
    <text x="8"   y="140">ускорение</text>
    <text x="340" y="270" text-anchor="middle">круг по периметру площадки, 3 повторения</text>
  </g>
</svg>
