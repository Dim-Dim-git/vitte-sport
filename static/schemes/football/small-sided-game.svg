<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="520" height="350" role="img" aria-label="Схема: двусторонняя игра на половине поля" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Двусторонняя игра</title>
  <rect x="70" y="40" width="380" height="250" rx="4" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="70" y1="165" x2="450" y2="165" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="260" cy="165" r="34" fill="none" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="215" y1="40"  x2="305" y2="40"  stroke="#132041" stroke-width="4"/>
  <line x1="215" y1="290" x2="305" y2="290" stroke="#132041" stroke-width="4"/>

  <circle cx="150" cy="95"  r="12" fill="#C21631"/>
  <circle cx="260" cy="80"  r="12" fill="#C21631"/>
  <circle cx="370" cy="95"  r="12" fill="#C21631"/>
  <circle cx="205" cy="135" r="12" fill="#C21631"/>
  <circle cx="150" cy="235" r="12" fill="#132041"/>
  <circle cx="260" cy="250" r="12" fill="#132041"/>
  <circle cx="370" cy="235" r="12" fill="#132041"/>
  <circle cx="315" cy="195" r="12" fill="#132041"/>
  <circle cx="260" cy="165" r="6"  fill="#4F6A84"/>

  <g font-family="Montserrat" font-size="13" fill="#4F6A84">
    <text x="260" y="315" text-anchor="middle">половина поля, составы 5 на 5</text>
