<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-label="Схема: этапы заминки" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Заминка и растяжка</title>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#4F6A84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40"  y="55" width="170" height="76" rx="8" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="255" y="55" width="170" height="76" rx="8" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="470" y="55" width="170" height="76" rx="8" fill="#F5F7FA" stroke="#E0E0E0" stroke-width="1"/>

  <line x1="216" y1="93" x2="248" y2="93" stroke="#4F6A84" stroke-width="2" marker-end="url(#a6)"/>
  <line x1="431" y1="93" x2="463" y2="93" stroke="#4F6A84" stroke-width="2" marker-end="url(#a6)"/>

  <g font-family="Montserrat" font-size="14" font-weight="bold" fill="#132041">
    <text x="125" y="86"  text-anchor="middle">Медленный бег</text>
    <text x="340" y="86"  text-anchor="middle">Растяжка</text>
    <text x="555" y="86"  text-anchor="middle">Дыхание</text>
  </g>
  <g font-family="Montserrat" font-size="13" fill="#C21631">
    <text x="125" y="110" text-anchor="middle">3 минуты</text>
    <text x="340" y="110" text-anchor="middle">5 минут</text>
    <text x="555" y="110" text-anchor="middle">2 минуты</text>
  </g>
  <g font-family="Montserrat" font-size="13" fill="#4F6A84">
    <text x="340" y="170" text-anchor="middle">бедро, икроножные, приводящие, спина</text>
    <text x="340" y="195" text-anchor="middle">каждое положение 30 секунд без пружинящих движений</text>
  </g>
</svg>
