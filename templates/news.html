{% extends 'base.html' %}

{% block title %}Новости — МУИВ Спорт{% endblock %}

{% block content %}
<div class="container" style="padding-top: 40px; padding-bottom: 60px;">
  <h2>Новости</h2>
  <div style="margin-top: 24px;">
    {% for item in news %}
      <div style="background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 16px;">
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">{{ item.created|date:"d.m.Y" }}</div>
        <h3>{{ item.title }}</h3>
        <p style="margin-top: 8px;">{{ item.content }}</p>
      </div>
    {% empty %}
      <p>Новости не добавлены</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
