{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <title>{% block title %}МУИВ Спорт{% endblock %}</title>
</head>
<body>

  <div style="background: var(--white); border-bottom: 3px solid var(--red); padding: 16px 0;">
    <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
      <a href="/" style="font-size: 20px; font-weight: 700; color: var(--dark);">МУИВ <span style="color: var(--red);">Спорт</span></a>
      <nav>
        <a href="/news/" style="margin-left: 24px; font-size: 14px; font-weight: 600; color: var(--dark);">Новости</a>
        <a href="/schedule/" style="margin-left: 24px; font-size: 14px; font-weight: 600; color: var(--dark);">Расписание</a>
        <a href="/sports/" style="margin-left: 24px; font-size: 14px; font-weight: 600; color: var(--dark);">Секции</a>
        <a href="/ratings/" style="margin-left: 24px; font-size: 14px; font-weight: 600; color: var(--dark);">Рейтинги</a>
        <a href="/contacts/" style="margin-left: 24px; font-size: 14px; font-weight: 600; color: var(--dark);">Контакты</a>
        <a href="/about/" style="margin-left: 24px; font-size: 14px; font-weight: 600; color: var(--dark);">О портале</a>
      </nav>
      {% if user.is_authenticated %}
        <a href="/profile/" style="font-size: 14px; color: var(--muted);">{{ user.username }}</a>
        <a href="/accounts/logout/" style="font-size: 14px; color: var(--muted); margin-left: 16px;">Выйти</a>
      {% else %}
        <a href="/accounts/login/" style="padding: 8px 20px; background: var(--red); color: var(--white); border-radius: 4px; font-size: 14px; font-weight: 600;">Войти</a>
      {% endif %}
    </div>
  </div>

  {% block content %}{% endblock %}

  <footer>
    <div class="container">
      <p>© 2025 МУИВ Спортивный портал</p>
    </div>
  </footer>

</body>
</html>
