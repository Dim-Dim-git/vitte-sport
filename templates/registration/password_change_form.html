{% extends 'base.html' %}

{% block title %}Смена пароля — МУИВ Спорт{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
  <a href="/profile/" style="font-size: 14px;">← Личный кабинет</a>
  <h2 style="margin-top: 16px;">Смена пароля</h2>

  <div style="background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-top: 20px;">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">{{ field.label }}</label>
          <input type="password" name="{{ field.html_name }}"
            style="display: block; width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 4px; font-size: 14px; font-family: inherit; outline: none;">
          {% if field.errors %}
            <p style="color: var(--red); font-size: 12px; margin-top: 4px;">{{ field.errors.0 }}</p>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit"
        style="padding: 10px 24px; background: var(--red); color: var(--white); border: none; border-radius: 4px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;">
        Сменить пароль
      </button>
    </form>
  </div>
</div>
{% endblock %}
